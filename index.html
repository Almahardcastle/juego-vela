<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evitá que se apague el fuego</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de Inicio -->
  <div id="screen-start" class="screen active">
    <h1 class="title">Evitá que se apague el fuego</h1>
    <button id="btn-start" class="btn">Jugar</button>
  </div>

  <!-- Pantalla de Juego -->
  <div id="screen-game" class="screen">
    <h2 class="title instruction">¡Apreta rapidamente la llama para q no se apague!</h2>
    <div class="candle-container">
      <div class="flame-wrapper" id="flame-wrapper">
        <img src="fuego.png" alt="Llama" class="flame-img" id="flame-img">
      </div>
      <img src="vela.png" alt="Vela" class="candle-img">
    </div>
  </div>

  <!-- Pantalla Final -->
  <div id="screen-win" class="screen">
    <h1 class="title">Gracias por no dejar que se apague</h1>
    <button id="btn-restart" class="btn">Jugar de nuevo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
